<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="270" y="38" font-size="22" font-weight="bold" fill="#1f2328">BMP280 pressure block - wiring</text>

  <rect x="40" y="80" width="260" height="330" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="58" y="110" font-size="16" font-weight="bold" fill="#1f2328">Arduino Uno / Nano</text>
  <rect x="60" y="135" width="220" height="44" rx="6" fill="#fff" stroke="#c0392b"/><text x="74" y="163" font-size="14" fill="#1f2328">3.3V</text>
  <rect x="60" y="195" width="220" height="44" rx="6" fill="#fff" stroke="#c0392b"/><text x="74" y="223" font-size="14" fill="#1f2328">GND</text>
  <rect x="60" y="255" width="220" height="44" rx="6" fill="#fff" stroke="#c0392b"/><text x="74" y="283" font-size="14" fill="#1f2328">A4 (SDA)</text>
  <rect x="60" y="315" width="220" height="44" rx="6" fill="#fff" stroke="#c0392b"/><text x="74" y="343" font-size="14" fill="#1f2328">A5 (SCL)</text>
  <text x="58" y="392" font-size="12" fill="#444">USB to laptop: power and Serial Monitor</text>

  <rect x="560" y="80" width="300" height="330" rx="10" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="578" y="110" font-size="16" font-weight="bold" fill="#1f2328">BMP280 module (I2C)</text>
  <rect x="580" y="135" width="260" height="44" rx="6" fill="#fff" stroke="#1e8449"/><text x="594" y="163" font-size="14" fill="#1f2328">VCC</text>
  <rect x="580" y="195" width="260" height="44" rx="6" fill="#fff" stroke="#1e8449"/><text x="594" y="223" font-size="14" fill="#1f2328">GND</text>
  <rect x="580" y="255" width="260" height="44" rx="6" fill="#fff" stroke="#1e8449"/><text x="594" y="283" font-size="14" fill="#1f2328">SDA</text>
  <rect x="580" y="315" width="260" height="44" rx="6" fill="#fff" stroke="#1e8449"/><text x="594" y="343" font-size="14" fill="#1f2328">SCL</text>
  <text x="578" y="385" font-size="12" fill="#444">SDO: GND = address 0x76, VCC = address 0x77</text>
  <text x="578" y="401" font-size="12" fill="#444">(many modules already set this, and CSB for I2C)</text>

  <line x1="280" y1="157" x2="580" y2="157" stroke="#d98200" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="280" y1="217" x2="580" y2="217" stroke="#222" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="280" y1="277" x2="580" y2="277" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="280" y1="337" x2="580" y2="337" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="460" font-size="12" fill="#444">Used on a breadboard (no PCB was made for this block). Add 4.7 kohm pull-ups on SDA and SCL if the module does not have them.</text>
  <text x="40" y="478" font-size="12" fill="#444">Check whether your module is 3.3 V only before connecting power.</text>
</svg>
